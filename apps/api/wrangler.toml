# Must match the Worker this deploys to. wrangler publishes to whatever name is
# declared here, so a mismatch silently creates a second Worker rather than
# updating the one you are looking at.
name = "fantasyflex"
# Points at compiled output rather than src/worker.ts so the Worker bundle is
# built by the same tsc invocation that typechecks everything else.
main = "dist/worker.js"
compatibility_date = "2024-12-01"
# nodejs_compat gives postgres.js the node built-ins it expects on Workers.
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[vars]
# Set these to your deployed web app's origin before going live — APP_URL is
# used to build invite and magic links, and it is the CORS allowlist default.
APP_URL = "https://your-app.pages.dev"
# ALLOWED_ORIGINS = "https://your-app.pages.dev,https://league.example.com"
SEASON = "2025"
DEV_EMAIL_TO_CONSOLE = "0"

# Hyperdrive pools Postgres connections in front of Supabase, which matters
# because Workers are per-request and would otherwise open a connection each
# time.
#
# This points at Supabase's DIRECT connection string, not the pooler: Hyperdrive
# does its own pooling, and stacking it on Supavisor double-pools and defeats the
# caching. The id is not a secret — it names a resource in this Cloudflare
# account and carries no credentials.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "94e8888916084f42b75700e6922cd85d"

# JWT_SECRET is a secret, not a var:
#   npx wrangler secret put JWT_SECRET
